<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    :root { color-scheme: dark; }
    body {
      width: 340px; margin: 0; padding: 14px;
      background: #181818; color: #eee;
      font: 400 13px/1.55 Roboto, Arial, sans-serif;
    }
    h1 {
      display: flex; align-items: center; gap: 8px;
      font-size: 14px; margin: 0 0 12px; font-weight: 600;
    }
    h1 img { width: 20px; height: 20px; }
    #copy-status {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 12px; border-radius: 8px; margin-bottom: 12px;
      background: #222; border-left: 3px solid #555; font-size: 12.5px;
    }
    #copy-status.ok { border-left-color: #6fcf7c; }
    #copy-status.err { border-left-color: #ff8a80; color: #ffb4ad; }
    button {
      width: 100%; border: none; border-radius: 8px; padding: 10px 12px;
      font: 500 13px/1.3 Roboto, Arial, sans-serif; cursor: pointer;
      background: #2c2c2c; color: #eee;
    }
    button:hover { background: #383838; }
    button.primary { background: #E22117; color: #fff; }
    button.primary:hover { background: #f22b20; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .stack > * + * { margin-top: 8px; }
    #compare-box { display: none; margin-top: 8px; }
    input[type="url"] {
      width: 100%; box-sizing: border-box; padding: 9px 11px; margin-bottom: 8px;
      border-radius: 8px; border: 1px solid #3a3a3a; background: #222; color: #eee;
      font-size: 12.5px;
    }
    input[type="url"]:focus { outline: none; border-color: #E22117; }
    details { margin-top: 14px; border-top: 1px solid #2a2a2a; padding-top: 12px; }
    summary { cursor: pointer; font-weight: 500; font-size: 12.5px; color: #ccc; }
    summary:hover { color: #fff; }
    textarea {
      width: 100%; box-sizing: border-box; height: 190px; margin: 10px 0 8px;
      border-radius: 8px; border: 1px solid #3a3a3a; background: #222; color: #ddd;
      padding: 10px; font: 400 11.5px/1.5 ui-monospace, Consolas, monospace;
      resize: vertical;
    }
    textarea:focus { outline: none; border-color: #E22117; }
    .row { display: flex; gap: 8px; }
    .hint { color: #888; font-size: 11.5px; margin: 8px 0 0; }
    footer { margin-top: 14px; border-top: 1px solid #2a2a2a; padding-top: 10px; }
    footer a { color: #ff8a80; font-size: 12px; text-decoration: none; }
    footer a:hover { text-decoration: underline; }
    .msg { font-size: 11.5px; min-height: 16px; margin-top: 2px; }
    .msg.ok { color: #6fcf7c; }
    .msg.err { color: #ff8a80; }
  </style>
</head>
<body>
  <h1><img src="icons/icon48.png" alt=""> YT Transcriptor</h1>

  <div id="copy-status">Copiando a transcrição…</div>

  <div class="stack">
    <button id="summarize" class="primary" type="button">Resumir este vídeo</button>
    <button id="compare-toggle" type="button">Comparar com outro vídeo</button>
  </div>

  <div id="compare-box">
    <input type="url" id="other-url" placeholder="Cole a URL do outro vídeo" spellcheck="false">
    <button id="compare-go" class="primary" type="button">Analisar os dois</button>
    <p class="hint">O segundo vídeo abre numa aba em segundo plano só para ler a transcrição e fecha sozinho.</p>
    <div class="msg" id="compare-msg"></div>
  </div>

  <details id="prompt-box">
    <summary>Instruções do resumo</summary>
    <textarea id="prompt" spellcheck="false"></textarea>
    <div class="row">
      <button id="prompt-save" class="primary" type="button">Salvar</button>
      <button id="prompt-reset" type="button">Restaurar padrão</button>
    </div>
    <div class="msg" id="prompt-msg"></div>
  </details>

  <footer><a href="#" id="options">Chave da API do Gemini →</a></footer>

  <script src="popup.js"></script>
</body>
</html>
